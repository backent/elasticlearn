[package]
name = "elasticlearn"
version = "0.1.0"
edition = "2021"
description = "Backend for ElasticLearn — a sandboxed Elasticsearch learning playground."
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "compression-gzip"] }
tower_governor = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures = "0.3"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono", "migrate"] }

jsonwebtoken = "9"
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
cookie = "0.18"

anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
