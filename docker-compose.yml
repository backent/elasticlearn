services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
    environment:
      - ES_URL=http://elasticsearch:9200
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - SESSION_TTL_MIN=${SESSION_TTL_MIN:-60}
      - DATABASE_URL=sqlite:///data/data.db?mode=rwc
      - BIND_ADDR=0.0.0.0:8080
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:5173}
      - RUST_LOG=info,elasticlearn=debug
    volumes:
      - backend-data:/data
    ports:
      - "8080:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_API_BASE=/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend-data:
